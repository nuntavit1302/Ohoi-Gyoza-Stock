<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohoi Kyoza - QR Code โต๊ะ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --crimson:#9B2226;--gold:#D4A373;--gold-light:#E9C496;
  --jade:#588157;--warm-white:#FDF6EC;--cream:#F5EBDC;
  --ink:#3D2B1F;--ink-muted:#9B8B7F;--shadow-warm:rgba(155,34,38,0.08);
}
body{font-family:'Noto Sans Thai',sans-serif;background:var(--warm-white);color:var(--ink);min-height:100vh;padding-bottom:40px;}

/* HEADER */
.header{background:linear-gradient(160deg,var(--crimson) 0%,#7B181C 60%,#5A1216 100%);padding:30px 20px 38px;text-align:center;position:relative;overflow:hidden;}
.header::before{content:'🪑';position:absolute;top:14px;left:18px;font-size:2rem;opacity:0.3;}
.header::after{content:'📱';position:absolute;top:14px;right:18px;font-size:2rem;opacity:0.3;}
.logo{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:700;color:var(--gold-light);letter-spacing:3px;}
.logo span{color:#FFF8F0;font-weight:400;font-style:italic;}
.subtitle{color:rgba(255,248,240,0.7);font-size:0.9rem;margin-top:8px;}

/* BACK BTN */
.back-btn{position:absolute;top:15px;left:55px;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3);color:rgba(255,248,240,0.9);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:0.8rem;font-weight:600;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all 0.3s;}
.back-btn:hover{background:rgba(255,255,255,0.25);}

/* CONTENT */
.content{max-width:860px;margin:0 auto;padding:28px 18px;}

/* CONTROL */
.control-card{background:#FFF;border-radius:20px;padding:24px;margin-bottom:24px;border:1px solid rgba(155,34,38,0.08);box-shadow:0 2px 12px var(--shadow-warm);}
.control-card::before{content:'';display:block;height:4px;background:linear-gradient(90deg,var(--crimson),var(--gold),var(--jade));border-radius:4px;margin:-24px -24px 20px;border-radius:20px 20px 0 0;}
.ctrl-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--crimson);margin-bottom:18px;}
.ctrl-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
.ctrl-group{display:flex;flex-direction:column;gap:7px;}
.ctrl-group label{font-weight:700;color:var(--crimson);font-size:0.85rem;}
.ctrl-group input{padding:11px 16px;border:1.5px solid rgba(155,34,38,0.15);border-radius:12px;font-family:inherit;font-size:0.95rem;background:var(--warm-white);color:var(--ink);width:180px;}
.ctrl-group input:focus{outline:none;border-color:var(--crimson);box-shadow:0 0 0 3px rgba(155,34,38,0.08);}
.gen-btn{padding:12px 24px;background:linear-gradient(135deg,var(--crimson),#AE2012);color:white;border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:0.95rem;cursor:pointer;transition:all 0.3s;}
.gen-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(155,34,38,0.3);}

/* URL PREVIEW */
.url-preview{background:var(--warm-white);border-radius:12px;padding:12px 16px;margin-top:14px;font-size:0.8rem;color:var(--ink-muted);word-break:break-all;border:1px solid rgba(155,34,38,0.1);}
.url-preview strong{color:var(--crimson);}

/* QR GRID */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;}

/* QR CARD */
.qr-card{
  background:#FFF;border-radius:22px;padding:22px 18px;
  text-align:center;border:1px solid rgba(155,34,38,0.08);
  box-shadow:0 3px 14px var(--shadow-warm);
  transition:all 0.35s ease; position:relative; overflow:hidden;
}
.qr-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--crimson),var(--gold));}
.qr-card:hover{transform:translateY(-5px);box-shadow:0 10px 30px rgba(155,34,38,0.14);}
.qr-table-label{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:700;color:var(--crimson);margin-bottom:4px;}
.qr-table-sub{font-size:0.72rem;color:var(--ink-muted);margin-bottom:14px;}
.qr-box{display:flex;justify-content:center;margin-bottom:14px;}
.qr-box canvas,.qr-box img{border-radius:10px;border:3px solid var(--cream);}
.qr-url{font-size:0.65rem;color:var(--ink-muted);word-break:break-all;margin-bottom:14px;line-height:1.5;padding:6px 10px;background:var(--warm-white);border-radius:8px;}
.btn-row{display:flex;gap:8px;justify-content:center;}
.dl-btn{flex:1;padding:9px 6px;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:0.75rem;cursor:pointer;transition:all 0.3s;}
.dl-btn.primary{background:linear-gradient(135deg,var(--crimson),#AE2012);color:white;}
.dl-btn.primary:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(155,34,38,0.3);}
.dl-btn.secondary{background:var(--cream);color:var(--ink);}
.dl-btn.secondary:hover{background:var(--gold);color:var(--crimson);}

/* PRINT ALL BTN */
.print-all-wrap{text-align:center;margin-bottom:24px;}
.print-all-btn{padding:13px 32px;background:linear-gradient(135deg,var(--jade),#6B9B6A);color:white;border:none;border-radius:14px;font-family:inherit;font-weight:700;font-size:0.95rem;cursor:pointer;box-shadow:0 4px 16px rgba(88,129,87,0.25);transition:all 0.3s;}
.print-all-btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(88,129,87,0.35);}

/* PRINT STYLES */
@media print{
  .header,.control-card,.print-all-wrap,.back-btn{display:none!important;}
  .qr-card{break-inside:avoid;box-shadow:none;border:2px solid #ddd;margin:8px;}
  .btn-row{display:none!important;}
  .qr-grid{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:600px){
  .ctrl-row{flex-direction:column;}
  .ctrl-group input{width:100%;}
  .logo{font-size:1.9rem;}
}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back-btn">← หน้าหลัก</a>
  <div class="logo">Ohoi <span>Kyoza</span></div>
  <div class="subtitle">📱 QR Code สำหรับแต่ละโต๊ะ</div>
</div>

<div class="content">

  <!-- CONTROL -->
  <div class="control-card">
    <div class="ctrl-title">⚙️ ตั้งค่า QR Code</div>
    <div class="ctrl-row">
      <div class="ctrl-group">
        <label>🌐 URL เว็บไซต์ของคุณ</label>
        <input type="text" id="base-url" value="https://nuntavit1302.github.io/customer.html" placeholder="https://...">
      </div>
      <div class="ctrl-group">
        <label>🪑 จำนวนโต๊ะ</label>
        <input type="number" id="table-count" value="4" min="1" max="30">
      </div>
      <div class="ctrl-group">
        <label>&nbsp;</label>
        <button class="gen-btn" onclick="generateAll()">🔄 สร้าง QR Code</button>
      </div>
    </div>
    <div class="url-preview" id="url-preview">
      ตัวอย่าง URL: <strong>https://nuntavit1302.github.io/customer.html?table=1</strong>
    </div>
  </div>

  <!-- PRINT ALL -->
  <div class="print-all-wrap">
    <button class="print-all-btn" onclick="window.print()">🖨️ พิมพ์ QR ทั้งหมด</button>
  </div>

  <!-- QR GRID -->
  <div class="qr-grid" id="qr-grid"></div>

</div>

<script>
// ===== GENERATE ALL QR =====
function generateAll() {
  const baseUrl    = document.getElementById('base-url').value.trim();
  const tableCount = parseInt(document.getElementById('table-count').value) || 4;
  const grid       = document.getElementById('qr-grid');

  // Update preview
  document.getElementById('url-preview').innerHTML =
    `ตัวอย่าง URL: <strong>${baseUrl}?table=1</strong>`;

  grid.innerHTML = '';

  for (let i = 1; i <= tableCount; i++) {
    const url = `${baseUrl}?table=${i}`;

    // Card
    const card = document.createElement('div');
    card.className = 'qr-card';
    card.id = `card-${i}`;
    card.innerHTML = `
      <div class="qr-table-label">🪑 โต๊ะ ${i}</div>
      <div class="qr-table-sub">Table ${i} · 桌 ${i}</div>
      <div class="qr-box" id="qr-box-${i}"></div>
      <div class="qr-url">${url}</div>
      <div class="btn-row">
        <button class="dl-btn primary" onclick="downloadQR(${i})">⬇️ ดาวน์โหลด</button>
        <button class="dl-btn secondary" onclick="copyURL(${i}, '${url}')">📋 Copy URL</button>
      </div>`;
    grid.appendChild(card);

    // Generate QR
    new QRCode(document.getElementById(`qr-box-${i}`), {
      text:          url,
      width:         160,
      height:        160,
      colorDark:     '#9B2226',
      colorLight:    '#FDF6EC',
      correctLevel:  QRCode.CorrectLevel.H
    });
  }
}

// ===== DOWNLOAD QR =====
function downloadQR(tableNo) {
  const box = document.getElementById(`qr-box-${tableNo}`);
  const canvas = box.querySelector('canvas');
  const img    = box.querySelector('img');

  if (canvas) {
    const link    = document.createElement('a');
    link.download = `QR_Table_${tableNo}.png`;
    link.href     = canvas.toDataURL('image/png');
    link.click();
  } else if (img) {
    // Fallback: open image in new tab
    window.open(img.src, '_blank');
  }
}

// ===== COPY URL =====
function copyURL(tableNo, url) {
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    btn.style.background = 'var(--jade)';
    btn.style.color = 'white';
    setTimeout(() => {
      btn.textContent = orig;
      btn.style.background = '';
      btn.style.color = '';
    }, 1800);
  }).catch(() => {
    prompt('Copy URL นี้:', url);
  });
}

// Auto generate on load
window.addEventListener('DOMContentLoaded', generateAll);

// Regenerate when table count changes
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('table-count').addEventListener('change', generateAll);
  document.getElementById('base-url').addEventListener('change', generateAll);
});
</script>
</body>
</html>
