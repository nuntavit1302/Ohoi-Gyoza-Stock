<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohoi Kyoza - ระบบจัดการสต๊อก</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&family=Cormorant+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --crimson: #9B2226;
            --crimson-light: #AE2012;
            --crimson-soft: rgba(155, 34, 38, 0.08);
            --gold: #D4A373;
            --gold-light: #E9C496;
            --gold-soft: rgba(212, 163, 115, 0.15);
            --jade: #588157;
            --jade-soft: rgba(88, 129, 87, 0.12);
            --warm-white: #FDF6EC;
            --cream: #F5EBDC;
            --paper: #FAF3E8;
            --ink: #3D2B1F;
            --ink-light: #6B5B4F;
            --ink-muted: #9B8B7F;
            --shadow-warm: rgba(155, 34, 38, 0.08);
        }

        body {
            font-family: 'Noto Sans Thai', sans-serif;
            background: var(--warm-white);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
            opacity: 0.6;
        }

        @keyframes lantern-glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(155, 34, 38, 0.15), 0 0 60px rgba(212, 163, 115, 0.1); }
            50% { box-shadow: 0 4px 30px rgba(155, 34, 38, 0.2), 0 0 80px rgba(212, 163, 115, 0.15); }
        }

        @keyframes warm-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .header {
            background: linear-gradient(160deg, var(--crimson) 0%, #7B181C 60%, #5A1216 100%);
            padding: 35px 20px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '🏮';
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 2rem;
            opacity: 0.4;
            animation: warm-pulse 4s ease-in-out infinite;
        }

        .header::after {
            content: '🏮';
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            opacity: 0.4;
            animation: warm-pulse 4s ease-in-out infinite 2s;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .logo span {
            color: #FFF8F0;
            font-weight: 400;
            font-style: italic;
        }

        .subtitle {
            color: rgba(255, 248, 240, 0.7);
            font-size: 0.95rem;
            margin-top: 8px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
            position: relative;
            z-index: 1;
        }

        .lang-btn {
            padding: 6px 14px;
            border: 1.5px solid rgba(212, 163, 115, 0.4);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 248, 240, 0.8);
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
        }

        .lang-btn:hover {
            background: rgba(212, 163, 115, 0.2);
            border-color: var(--gold);
            transform: translateY(-1px);
        }

        .lang-btn.active {
            background: rgba(212, 163, 115, 0.25);
            border-color: var(--gold-light);
            color: var(--gold-light);
            box-shadow: 0 2px 15px rgba(212, 163, 115, 0.2);
        }

        .nav-tabs {
            display: flex;
            background: var(--cream);
            border-bottom: 1px solid rgba(155, 34, 38, 0.1);
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-tabs::-webkit-scrollbar { display: none; }

        .nav-tab {
            flex: 1;
            min-width: 90px;
            padding: 16px 10px;
            border: none;
            background: none;
            color: var(--ink-muted);
            font-family: 'Noto Sans Thai', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            white-space: nowrap;
            border-radius: 12px 12px 0 0;
            margin: 0 2px;
        }

        .nav-tab:hover {
            color: var(--crimson);
            background: rgba(155, 34, 38, 0.05);
        }

        .nav-tab.active {
            color: var(--crimson);
            background: var(--paper);
            font-weight: 700;
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--crimson), var(--gold), var(--crimson), transparent);
            border-radius: 3px;
        }

        .content {
            padding: 25px 20px;
            max-width: 900px;
            margin: 0 auto;
            background: var(--paper);
            min-height: calc(100vh - 200px);
        }

        .tab-content { display: none; animation: slide-up 0.4s ease; }
        .tab-content.active { display: block; }

        .card {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            border: 1px solid rgba(155, 34, 38, 0.06);
            box-shadow: 0 2px 8px var(--shadow-warm), 0 8px 32px rgba(155, 34, 38, 0.04);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--crimson), var(--gold), var(--jade), var(--gold), var(--crimson));
            opacity: 0.6;
        }

        .card:hover {
            box-shadow: 0 4px 16px var(--shadow-warm), 0 12px 40px rgba(155, 34, 38, 0.08);
            transform: translateY(-2px);
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--crimson);
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(155, 34, 38, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(145deg, #FFFFFF 0%, var(--warm-white) 100%);
            border: 1px solid rgba(155, 34, 38, 0.1);
            border-radius: 20px;
            padding: 22px 15px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            animation: lantern-glow 4s ease-in-out infinite;
        }

        .stat-card:nth-child(1) { border-top: 3px solid var(--crimson); }
        .stat-card:nth-child(2) { border-top: 3px solid var(--gold); animation-delay: 1.3s; }
        .stat-card:nth-child(3) { border-top: 3px solid var(--jade); animation-delay: 2.6s; }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(155, 34, 38, 0.12);
        }

        .stat-card h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .stat-card:nth-child(1) h3 { color: var(--crimson); }
        .stat-card:nth-child(2) h3 { color: var(--gold); }
        .stat-card:nth-child(3) h3 { color: var(--jade); }

        .stat-card p {
            color: var(--ink-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--crimson);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            background: var(--warm-white);
            border: 1.5px solid rgba(155, 34, 38, 0.15);
            border-radius: 14px;
            color: var(--ink);
            font-family: 'Noto Sans Thai', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--crimson);
            box-shadow: 0 0 0 4px var(--crimson-soft);
            background: #FFFFFF;
        }

        .form-group input::placeholder { color: var(--ink-muted); opacity: 0.6; }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 14px;
            font-family: 'Noto Sans Thai', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--crimson), var(--crimson-light));
            color: #FFF8F0;
            box-shadow: 0 4px 15px rgba(155, 34, 38, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(155, 34, 38, 0.35);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-success {
            background: linear-gradient(135deg, var(--jade), #6B9B6A);
            color: #FFF8F0;
            box-shadow: 0 4px 15px rgba(88, 129, 87, 0.25);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(88, 129, 87, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, #C0392B, #E74C3C);
            color: #FFF8F0;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.25);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(155, 34, 38, 0.08);
            background: #FFFFFF;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9rem;
        }

        th {
            background: linear-gradient(180deg, var(--cream) 0%, var(--warm-white) 100%);
            color: var(--crimson);
            padding: 16px 12px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(155, 34, 38, 0.1);
            position: sticky;
            top: 0;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(155, 34, 38, 0.05);
            color: var(--ink-light);
        }

        tr:hover td {
            background: var(--crimson-soft);
            color: var(--ink);
        }

        tr:last-child td { border-bottom: none; }

        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-success {
            background: var(--jade-soft);
            color: var(--jade);
            border: 1px solid rgba(88, 129, 87, 0.3);
        }

        .badge-warning {
            background: var(--gold-soft);
            color: #B8860B;
            border: 1px solid rgba(212, 163, 115, 0.4);
        }

        .badge-danger {
            background: rgba(155, 34, 38, 0.08);
            color: var(--crimson);
            border: 1px solid rgba(155, 34, 38, 0.3);
        }

        .alert {
            padding: 18px 22px;
            border-radius: 16px;
            margin-bottom: 15px;
            border: 1px solid;
            position: relative;
            background: #FFFFFF;
        }

        .alert-danger {
            border-color: rgba(155, 34, 38, 0.2);
            background: linear-gradient(135deg, #FFF5F5 0%, #FFFFFF 100%);
            color: var(--crimson);
        }

        .alert-danger::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--crimson), var(--crimson-light));
            border-radius: 16px 0 0 16px;
        }

        .alert-warning {
            border-color: rgba(212, 163, 115, 0.3);
            background: linear-gradient(135deg, #FFFBF5 0%, #FFFFFF 100%);
            color: #8B6914;
        }

        .alert-warning::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--gold), var(--gold-light));
            border-radius: 16px 0 0 16px;
        }

        .alert-success {
            border-color: rgba(88, 129, 87, 0.2);
            background: linear-gradient(135deg, #F5FBF5 0%, #FFFFFF 100%);
            color: var(--jade);
        }

        .alert-success::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--jade), #6B9B6A);
            border-radius: 16px 0 0 16px;
        }

        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--warm-white);
            border: 1.5px solid rgba(155, 34, 38, 0.12);
            border-radius: 14px;
            color: var(--ink);
            font-family: 'Noto Sans Thai', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--crimson);
            box-shadow: 0 0 0 4px var(--crimson-soft);
            background: #FFFFFF;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.5;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--ink-muted);
        }

        .empty-state-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .warm-text { color: var(--gold); font-weight: 700; }
        .crimson-text { color: var(--crimson); font-weight: 700; }

        .warm-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(155, 34, 38, 0.15), var(--gold), rgba(155, 34, 38, 0.15), transparent);
            margin: 25px 0;
        }

        .footer-note {
            text-align: center;
            padding: 30px 20px;
            color: var(--ink-muted);
            font-size: 0.85rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .logo { font-size: 2rem; }
            .stats-grid { grid-template-columns: 1fr; gap: 12px; }
            .form-row { grid-template-columns: 1fr; }
            .nav-tab { font-size: 0.75rem; padding: 14px 6px; min-width: 80px; }
            .content { padding: 18px 15px; }
            .card { padding: 20px; border-radius: 16px; }
            table { font-size: 0.8rem; }
            th, td { padding: 12px 8px; }
            .header::before, .header::after { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Ohoi <span>Kyoza</span></div>
        <div class="subtitle" data-i18n="header_subtitle">ระบบจัดการสต๊อก — ร้านเกี๊ยวซ่าไต้หวัน</div>
        <div class="lang-switcher">
            <button class="lang-btn active" onclick="changeLanguage('th')" data-lang="th">🇹🇭 ไทย</button>
            <button class="lang-btn" onclick="changeLanguage('en')" data-lang="en">🇬🇧 EN</button>
            <button class="lang-btn" onclick="changeLanguage('zh')" data-lang="zh">🇨🇳 中文</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" onclick="showTab('dashboard')" data-i18n="tab_dashboard">📊 แดชบอร์ด</button>
        <button class="nav-tab" onclick="showTab('products')" data-i18n="tab_products">📦 สินค้า</button>
        <button class="nav-tab" onclick="showTab('stock-in')" data-i18n="tab_stock_in">📥 รับเข้า</button>
        <button class="nav-tab" onclick="showTab('stock-out')" data-i18n="tab_stock_out">📤 จ่ายออก</button>
        <button class="nav-tab" onclick="showTab('history')" data-i18n="tab_history">📋 ประวัติ</button>
    </div>

    <div class="content">
        
        <div id="dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="total-products">0</h3>
                    <p data-i18n="stat_total">รายการสินค้า</p>
                </div>
                <div class="stat-card">
                    <h3 id="low-stock-count">0</h3>
                    <p data-i18n="stat_low">สินค้าใกล้หมด</p>
                </div>
                <div class="stat-card">
                    <h3 id="expiring-count">0</h3>
                    <p data-i18n="stat_expiring">ใกล้หมดอายุ</p>
                </div>
            </div>
            <div class="card">
                <div class="card-title" data-i18n="alerts_title">⚠️ แจ้งเตือน</div>
                <div id="alerts-container"></div>
            </div>
        </div>

        <div id="products" class="tab-content">
            <div class="card">
                <div class="card-title" data-i18n="add_product_title">➕ เพิ่มสินค้าใหม่</div>
                <form id="product-form" onsubmit="addProduct(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="label_code">รหัสสินค้า</label>
                            <input type="text" id="prod-code" placeholder="RAW-001" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="label_name">ชื่อสินค้า</label>
                            <input type="text" id="prod-name" placeholder="เนื้อหมูสับ" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="label_category">หมวดหมู่</label>
                            <select id="prod-category" required></select>
                        </div>
                        <div class="form-group">
                            <label data-i18n="label_unit">หน่วย</label>
                            <select id="prod-unit" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="label_min">สต๊อกขั้นต่ำ</label>
                            <input type="number" id="prod-min" placeholder="5" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="label_stock">สต๊อกเริ่มต้น</label>
                            <input type="number" id="prod-stock" placeholder="10" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label data-i18n="label_expiry">วันหมดอายุ</label>
                            <input type="date" id="prod-expiry">
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-i18n="label_location">ที่จัดเก็บ</label>
                        <input type="text" id="prod-location" placeholder="ตู้เย็น 1, ชั้น A">
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n="btn_save_product">💾 บันทึกสินค้า</button>
                </form>
            </div>
            <div class="card">
                <div class="card-title" data-i18n="product_list_title">📋 รายการสินค้า</div>
                <div class="search-box">
                    <input type="text" id="product-search" placeholder="ค้นหาสินค้า..." onkeyup="searchProducts()">
                </div>
                <div class="table-container">
                    <div id="products-table-container"></div>
                </div>
            </div>
        </div>

        <div id="stock-in" class="tab-content">
            <div class="card">
                <div class="card-title" data-i18n="stock_in_title">📥 รับสินค้าเข้า</div>
                <form id="stock-in-form" onsubmit="addStockIn(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="label_select_product">เลือกสินค้า</label>
                            <select id="in-product" required></select>
                        </div>
                        <div class="form-group">
                            <label data-i18n="label_quantity_in">จำนวน</label>
                            <input type="number" id="in-quantity" min="0.01" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="label_price">ราคา/หน่วย (บาท)</label>
                            <input type="number" id="in-price" min="0" step="0.01" placeholder="45.50">
                        </div>

        // ===== STATE =====
        let currentLang = localStorage.getItem('ok_lang') || 'th';
        let products = JSON.parse(localStorage.getItem('ok_products')) || [];
        let transactions = JSON.parse(localStorage.getItem('ok_transactions')) || [];

        // ===== RENDER DROPDOWNS =====
        function renderDropdowns() {
            // Categories
            const catSelect = document.getElementById('prod-category');
            catSelect.innerHTML = `<option value="">${t('select_category')}</option>` +
                Object.entries(dropdownData.categories).map(([key, val]) => 
                    `<option value="${key}">${val[currentLang]}</option>`
                ).join('');

            // Units
            const unitSelect = document.getElementById('prod-unit');
            unitSelect.innerHTML = `<option value="">${t('select_unit')}</option>` +
                Object.entries(dropdownData.units).map(([key, val]) => 
                    `<option value="${key}">${val[currentLang]}</option>`
                ).join('');

            // Out types
            const outTypeSelect = document.getElementById('out-type');
            outTypeSelect.innerHTML = `<option value="">${t('select_type')}</option>` +
                Object.entries(dropdownData.outTypes).map(([key, val]) => 
                    `<option value="${key}">${val[currentLang]}</option>`
                ).join('');
        }

        // ===== GET DISPLAY NAME =====
        function getCategoryDisplay(key) {
            return dropdownData.categories[key]?.[currentLang] || key;
        }
        function getUnitDisplay(key) {
            return dropdownData.units[key]?.[currentLang] || key;
        }
        function getOutTypeDisplay(key) {
            return dropdownData.outTypes[key]?.[currentLang] || key;
        }

        // ===== LANGUAGE =====
        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('ok_lang', lang);
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang][key]) el.textContent = translations[lang][key];
            });
            renderDropdowns();
            renderProducts();
            renderHistory();
            updateDashboard();
            updateProductSelects();
        }

        function t(key, params = {}) {
            let text = translations[currentLang][key] || key;
            Object.keys(params).forEach(k => { text = text.replace(`{${k}}`, params[k]); });
            return text;
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', () => {
            renderDropdowns();
            changeLanguage(currentLang);
        });

        // ===== TABS =====
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            if (tabId === 'dashboard') updateDashboard();
            if (tabId === 'products') renderProducts();
            if (tabId === 'history') renderHistory();
        }

        // ===== PRODUCTS =====
        function addProduct(e) {
            e.preventDefault();
            const product = {
                id: Date.now(),
                code: document.getElementById('prod-code').value,
                name: document.getElementById('prod-name').value,
                category: document.getElementById('prod-category').value,
                unit: document.getElementById('prod-unit').value,
                minStock: parseFloat(document.getElementById('prod-min').value),
                stock: parseFloat(document.getElementById('prod-stock').value),
                expiry: document.getElementById('prod-expiry').value,
                location: document.getElementById('prod-location').value,
                createdAt: new Date().toISOString()
            };
            products.push(product);
            saveData();
            document.getElementById('product-form').reset();
            renderProducts();
            updateProductSelects();
            updateDashboard();
            alert(t('msg_add_success'));
        }

        function deleteProduct(id) {
            if (confirm(t('msg_delete_confirm'))) {
                products = products.filter(p => p.id !== id);
                saveData();
                renderProducts();
                updateProductSelects();
                updateDashboard();
            }
        }

        // ===== STOCK IN =====
        function addStockIn(e) {
            e.preventDefault();
            const productId = parseInt(document.getElementById('in-product').value);
            const quantity = parseFloat(document.getElementById('in-quantity').value);
            const price = parseFloat(document.getElementById('in-price').value) || 0;
            const expiry = document.getElementById('in-expiry').value;
            const note = document.getElementById('in-note').value;
            const product = products.find(p => p.id === productId);
            if (!product) return;
            product.stock += quantity;
            if (expiry) product.expiry = expiry;
            const transaction = {
                id: Date.now(), type: 'in', productId, productName: product.name,
                productCode: product.code, quantity, price, total: price * quantity,
                note, date: new Date().toISOString()
            };
            transactions.push(transaction);
            saveData();
            document.getElementById('stock-in-form').reset();
            renderProducts();
            updateDashboard();
            alert(t('msg_stock_in_success', {name: product.name, qty: quantity, unit: getUnitDisplay(product.unit)}));
        }

        // ===== STOCK OUT =====
        function addStockOut(e) {
            e.preventDefault();
            const productId = parseInt(document.getElementById('out-product').value);
            const quantity = parseFloat(document.getElementById('out-quantity').value);
            const type = document.getElementById('out-type').value;
            const reason = document.getElementById('out-reason').value;
            const note = document.getElementById('out-note').value;
            const product = products.find(p => p.id === productId);
            if (!product) return;
            if (product.stock < quantity) {
                alert(t('msg_stock_low', {stock: product.stock, unit: getUnitDisplay(product.unit)}));
                return;
            }
            product.stock -= quantity;
            const transaction = {
                id: Date.now(), type: 'out', productId, productName: product.name,
                productCode: product.code, quantity, outType: type, reason, note,
                date: new Date().toISOString()
            };
            transactions.push(transaction);
            saveData();
            document.getElementById('stock-out-form').reset();
            renderProducts();
            updateDashboard();
            alert(t('msg_stock_out_success', {name: product.name, qty: quantity, unit: getUnitDisplay(product.unit)}));
        }

        // ===== RENDER =====
        function renderProducts() {
            const search = document.getElementById('product-search')?.value.toLowerCase() || '';
            const filtered = products.filter(p =>
                p.name.toLowerCase().includes(search) ||
                p.code.toLowerCase().includes(search)
            );
            let html = `<table><thead><tr>
                <th>${t('table_code')}</th><th>${t('table_name')}</th><th>${t('table_category')}</th>
                <th>${t('table_stock')}</th><th>${t('table_min')}</th><th>${t('table_status')}</th>
                <th>${t('table_expiry')}</th><th>${t('table_action')}</th>
            </tr></thead><tbody>`;
            if (filtered.length === 0) {
                html += `<tr><td colspan="8" class="empty-state">
                    <div class="empty-state-icon">📦</div><p>${t('empty_products')}</p></td></tr>`;
            } else {
                filtered.forEach(p => {
                    const status = getStockStatus(p);
                    const expWarn = getExpiryWarning(p.expiry);
                    html += `<tr>
                        <td><strong class="crimson-text">${p.code}</strong></td>
                        <td>${p.name}</td>
                        <td>${getCategoryDisplay(p.category)}</td>
                        <td><span class="warm-text">${p.stock}</span> ${getUnitDisplay(p.unit)}</td>
                        <td>${p.minStock} ${getUnitDisplay(p.unit)}</td>
                        <td><span class="badge ${status.class}">${status.text}</span></td>
                        <td>${p.expiry ? formatDate(p.expiry) + ' ' + expWarn : '-'}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">🗑️</button></td>
                    </tr>`;
                });
            }
            html += '</tbody></table>';
            document.getElementById('products-table-container').innerHTML = html;
        }

        function renderHistory() {
            const search = document.getElementById('history-search')?.value.toLowerCase() || '';
            const filtered = transactions.filter(t =>
                t.productName.toLowerCase().includes(search) ||
                t.productCode.toLowerCase().includes(search)
            ).sort((a, b) => new Date(b.date) - new Date(a.date));
            let html = `<table><thead><tr>
                <th>${t('table_date')}</th><th>${t('table_type')}</th><th>${t('table_code')}</th>
                <th>${t('table_name')}</th><th>${t('table_quantity')}</th><th>${t('table_detail')}</th>
            </tr></thead><tbody>`;
            if (filtered.length === 0) {
                html += `<tr><td colspan="6" class="empty-state">
                    <div class="empty-state-icon">📋</div><p>${t('empty_history')}</p></td></tr>`;
            } else {
                filtered.forEach(t => {
                    const badge = t.type === 'in'
                        ? `<span class="badge badge-success">${t('in_type')}</span>`
                        : `<span class="badge badge-danger">${t('out_type')}</span>`;
                    const detail = t.type === 'in'
                        ? `${t.note || ''}`
                        : `${getOutTypeDisplay(t.outType)} ${t.reason ? '- ' + t.reason : ''} ${t.note ? '(' + t.note + ')' : ''}`;
                    html += `<tr>
                        <td>${formatDateTime(t.date)}</td>
                        <td>${badge}</td>
                        <td><span class="crimson-text">${t.productCode}</span></td>
                        <td>${t.productName}</td>
                        <td><strong class="warm-text">${t.quantity}</strong> ${getUnitDisplay(t.unit || '')}</td>
                        <td>${detail}</td>
                    </tr>`;
                });
            }
            html += '</tbody></table>';
            document.getElementById('history-table-container').innerHTML = html;
        }

        function updateDashboard() {
            document.getElementById('total-products').textContent = products.length;
            const low = products.filter(p => p.stock <= p.minStock);
            document.getElementById('low-stock-count').textContent = low.length;
            const expSoon = products.filter(p => {
                if (!p.expiry) return false;
                const days = getDaysUntilExpiry(p.expiry);
                return days <= 7 && days >= 0;
            });
            document.getElementById('expiring-count').textContent = expSoon.length;

            let html = '';
            if (low.length > 0) {
                html += `<div class="alert alert-danger"><strong>${t('alert_low_stock')}</strong><ul style="margin-top:10px; padding-left:20px;">`;
                low.forEach(p => html += `<li>${p.name} (${p.stock}/${p.minStock} ${getUnitDisplay(p.unit)})</li>`);
                html += '</ul></div>';
            }
            const expired = products.filter(p => p.expiry && getDaysUntilExpiry(p.expiry) < 0);
            if (expired.length > 0) {
                html += `<div class="alert alert-danger"><strong>${t('alert_expired')}</strong><ul style="margin-top:10px; padding-left:20px;">`;
                expired.forEach(p => html += `<li>${p.name} (${formatDate(p.expiry)})</li>`);
                html += '</ul></div>';
            }
            if (expSoon.length > 0) {
                html += `<div class="alert alert-warning"><strong>${t('alert_expiring')}</strong><ul style="margin-top:10px; padding-left:20px;">`;
                expSoon.forEach(p => {
                    const days = getDaysUntilExpiry(p.expiry);
                    html += `<li>${p.name} (${t('days_left', {days})} - ${formatDate(p.expiry)})</li>`;
                });
                html += '</ul></div>';
            }
            if (html === '') {
                html = `<div class="alert alert-success"><strong>${t('alert_no_issue')}</strong></div>`;
            }
            document.getElementById('alerts-container').innerHTML = html;
        }

        function updateProductSelects() {
            const inSel = document.getElementById('in-product');
            const outSel = document.getElementById('out-product');
            const opts = products.map(p =>
                `<option value="${p.id}">${p.code} - ${p.name} (${p.stock} ${getUnitDisplay(p.unit)})</option>`
            ).join('');
            inSel.innerHTML = `<option value="">${t('label_select_product')}</option>` + opts;
            outSel.innerHTML = `<option value="">${t('label_select_product')}</option>` + opts;
        }

        function searchProducts() { renderProducts(); }
        function searchHistory() { renderHistory(); }

        function getStockStatus(p) {
            if (p.stock <= 0) return { class: 'badge-danger', text: t('status_out') };
            if (p.stock <= p.minStock) return { class: 'badge-warning', text: t('status_low') };
            return { class: 'badge-success', text: t('status_normal') };
        }

        function getExpiryWarning(date) {
            if (!date) return '';
            const days = getDaysUntilExpiry(date);
            if (days < 0) return '<span class="badge badge-danger">' + t('status_out') + '</span>';
            if (days <= 3) return '<span class="badge badge-danger">' + t('status_low') + '</span>';
            if (days <= 7) return '<span class="badge badge-warning">' + t('days_left', {days}) + '</span>';
            return '';
        }

        function getDaysUntilExpiry(date) {
            const today = new Date(); today.setHours(0,0,0,0);
            const exp = new Date(date); exp.setHours(0,0,0,0);
            return Math.ceil((exp - today) / (1000*60*60*24));
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if (currentLang === 'zh') return d.toLocaleDateString('zh-CN', {year:'numeric', month:'short', day:'numeric'});
            if (currentLang === 'en') return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
            return d.toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
        }

        function formatDateTime(dateStr) {
            const d = new Date(dateStr);
            if (currentLang === 'zh') return d.toLocaleString('zh-CN', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
            if (currentLang === 'en') return d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
            return d.toLocaleString('th-TH', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
        }

        function saveData() {
            localStorage.setItem('ok_products', JSON.stringify(products));
            localStorage.setItem('ok_transactions', JSON.stringify(transactions));
        }
    </script>
</body>
</html>
